services:
  postgres:
    image: ghcr.io/thirdcoastinteractive/rewind-postgres-vector:${REWIND_VERSION:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./bin/dev/postgres/data:/var/lib/postgresql/data
    command:
      [
        "postgres",
        "-c", "max_connections=300",
        "-c", "shared_preload_libraries=pg_stat_statements",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rewind-network

  rewind:
    image: ghcr.io/thirdcoastinteractive/rewind:${REWIND_VERSION:-latest}
    restart: unless-stopped
    environment:
      WEBSERVER_PORT: 8080
      DATABASE_DSN: ${DATABASE_DSN:?set DATABASE_DSN in .env}
      DATABASE_RETRIES: ${DATABASE_RETRIES:?set DATABASE_RETRIES in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SFU_PORT: 8081
      SFU_SIGNAL_URL: ws://127.0.0.1:8081/signal
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      SFU_NAT_IP: ${SFU_NAT_IP:-}
      SPOOL_DIR: /spool
      DOWNLOADS_DIR: /downloads
      EXPORTS_DIR: /exports
      FONTS_DIR: /fonts
      VISION_URL: http://rewind-ml:3003
      VISION_TOKEN: ${VISION_TOKEN:-${ENCRYPTION_KEY}}
    volumes:
      - ./bin/spool:/spool
      - ./bin/download:/downloads
      - ./bin/exports:/exports
      - ./bin/fonts:/fonts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEBSERVER_PORT:?set WEBSERVER_PORT in .env}:8080"
      - "50000-50100:50000-50100/udp"
    networks:
      - rewind-network

  rewind-ml:
    image: ghcr.io/thirdcoastinteractive/rewind-ml:${REWIND_VERSION:-latest}${ML_IMAGE_SUFFIX:-}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_DSN: ${DATABASE_DSN:?set DATABASE_DSN in .env}
      DATABASE_RETRIES: ${DATABASE_RETRIES:-10}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      DOWNLOADS_DIR: /downloads
      WHISPER_CMD: whisper-cli
      WHISPER_MODEL_DIR: /models/whisper
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-en}
      WHISPER_TASK: ${WHISPER_TASK:-transcribe}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      OLLAMA_MODELS: /models/ollama
      OLLAMA_NOPRUNE: "true"
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_LLM_LIBRARY: ${OLLAMA_LLM_LIBRARY:-}
      CONTEXT_MODEL: ${CONTEXT_MODEL:-qwen3.8:27b}
      VISION_URL: http://127.0.0.1:3003
      VISION_TOKEN: ${VISION_TOKEN:-${ENCRYPTION_KEY}}
      VISION_DEVICE: ${VISION_DEVICE:-cpu}
      VISION_MODEL_DIR: /models/vision
      TEXTCLS_URL: http://127.0.0.1:3004
      TEXTCLS_APP_DIR: /opt/textcls
      TEXTCLS_MODEL_DIR: /models/textcls
      TEXTCLS_DEVICE: ${TEXTCLS_DEVICE:-cpu}
      DIARIZE_URL: http://127.0.0.1:3005
      DIARIZE_APP_DIR: /opt/diarize
      DIARIZE_MODEL_DIR: /models/diarize
      DIARIZE_TOKEN: ${DIARIZE_TOKEN:-${ENCRYPTION_KEY}}
      VISUAL_BACKFILL_ENABLED: ${VISUAL_BACKFILL_ENABLED:-false}
      RUNTIME_DIR: /runtime
      OLLAMA_VERSION: ${OLLAMA_VERSION:-0.33.2}
      ML_RUNTIME: ${ML_RUNTIME:-runtime-cpu}
    volumes:
      - ./bin/download:/downloads
      - ./bin/models/whisper:/models/whisper
      - ./bin/models/ollama:/models/ollama
      - ./bin/models/vision:/models/vision
      - ./bin/models/textcls:/models/textcls
      - ./bin/models/diarize:/models/diarize
      - ./bin/runtime:/runtime
    depends_on:
      postgres:
        condition: service_healthy
    networks: [rewind-network]

networks:
  rewind-network:
    driver: bridge
