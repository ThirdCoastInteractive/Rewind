name: rewind-integration
services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres-vector.Dockerfile
    image: rewind-postgres-vector:test
    environment:
      POSTGRES_DB: rewind_test
      POSTGRES_USER: rewind_test
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:15439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewind_test -d rewind_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  vision:
    build:
      context: ./services/vision
      dockerfile: Dockerfile
    image: rewind-vision:test
    command: ["python3", "-m", "pytest", "-q", "/app/test_service.py"]
    environment:
      VISION_MODEL_DIR: /tmp/test-models
