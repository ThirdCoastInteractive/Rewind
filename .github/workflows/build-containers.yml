name: Build and Push Container Images

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    if: github.repository == 'ThirdCoastInteractive/Rewind'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start disposable integration database
        run: docker compose -f docker-compose.integration.yml up -d --wait postgres
      - name: Run release guardrails and regression tests
        run: make release-gates
      - name: Check public release commit
        run: bash scripts/check-release.sh --commit HEAD
      - name: Stop disposable integration database
        if: always()
        run: docker compose -f docker-compose.integration.yml down

  build:
    needs: preflight
    if: github.repository == 'ThirdCoastInteractive/Rewind'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        include:
          - service: rewind
            dockerfile: rewind.Dockerfile
            image: rewind
          - service: ml
            dockerfile: ml.Dockerfile
            target: runtime-cpu
            image: rewind-ml
          - service: ml
            dockerfile: ml.Dockerfile
            target: runtime-cuda
            suffix: -cuda
            image: rewind-ml
          - service: postgres-vector
            dockerfile: docker/postgres-vector.Dockerfile
            image: rewind-postgres-vector

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thirdcoastinteractive/${{ matrix.image }}
          tags: |
            type=raw,value=latest${{ matrix.suffix }}
            type=semver,pattern={{version}}${{ matrix.suffix }}
            type=sha,prefix=,suffix=${{ matrix.suffix }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}${{ matrix.suffix }}
          provenance: false
